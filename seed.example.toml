# Example seed configuration.
#
# `nitro_repo seed --config seed.example.toml` deploys this suite into a running
# instance over the real Maven, npm, Cargo and Docker protocols. Re-running is safe —
# anything already present is left alone.
#
# Regenerate with: nitro_repo seed --config seed.toml --write-example

url = "http://localhost:6742"

[auth]
username = "admin"
password = "changeme"

[[storages]]
name = "local"
type = "Local"

[storages.settings]
path = "./storage/local"

[[repositories]]
storage = "local"
name = "releases"
type = "maven"
visibility = "Public"

[[repositories]]
storage = "local"
name = "snapshots"
type = "maven"
visibility = "Public"

[[repositories]]
storage = "local"
name = "npm"
type = "npm"
visibility = "Public"

[[repositories]]
storage = "local"
name = "crates"
type = "cargo"
visibility = "Public"

[[repositories]]
storage = "local"
name = "docker"
type = "docker"
visibility = "Public"

[[maven]]
repository = "local/releases"
group_id = "dev.kingtux"
artifact_id = "tms"
versions = ["1.0.0", "1.0.1", "1.1.0", "2.0.0-beta.1"]
description = "A seeded example artifact"
classifiers = ["sources", "javadoc"]
dependencies = ["org.slf4j:slf4j-api:2.0.13"]

[[maven]]
repository = "local/releases"
group_id = "dev.kingtux.tools"
artifact_id = "nested-example"
versions = ["0.1.0"]
description = "A deeper group id, to exercise nested paths"
classifiers = []
dependencies = ["dev.kingtux:tms:1.1.0"]

[[maven]]
repository = "local/snapshots"
group_id = "dev.kingtux"
artifact_id = "tms"
versions = ["1.2.0-SNAPSHOT"]
description = "Snapshot deploys, for maven-metadata.xml"
classifiers = ["sources", "javadoc"]
dependencies = []

[[npm]]
repository = "local/npm"
name = "@nitro/example"
versions = ["1.0.0", "1.0.1", "1.1.0"]
description = "A scoped package"

[npm.dist_tags]

[[npm]]
repository = "local/npm"
name = "nitro.helpers"
versions = ["0.1.0", "0.2.0"]
description = "An unscoped package with a dot in its name"

[npm.dist_tags]

[[npm]]
repository = "local/npm"
name = "@nitro/prerelease"
versions = ["1.0.0", "2.0.0-beta.1"]
description = "Prerelease versions, and a non-latest dist-tag"

[npm.dist_tags]
next = "2.0.0-beta.1"

# Four characters or more, so the sparse index path goes through the `{c1c2}/{c3c4}/`
# branch rather than one of the short-name special cases.
[[cargo]]
repository = "local/crates"
name = "nitro-example"
versions = ["0.1.0", "0.2.0", "1.0.0"]
description = "A seeded crate"

# Three characters: the `3/{first}/` branch, which is easy to get wrong.
[[cargo]]
repository = "local/crates"
name = "nrx"
versions = ["0.1.0"]
description = "A short crate name, for the index prefix rule"

# The name carries no `{storage}/{repository}` prefix — the seeder adds it, because a
# registry with no hostname of its own is addressed as
# `docker pull localhost:6742/local/docker/example:1.0`.
[[docker]]
repository = "local/docker"
name = "example"
tags = ["1.0", "latest"]
