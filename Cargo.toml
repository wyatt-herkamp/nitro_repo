[workspace]
members = ["crates/*", "nitro_repo"]
resolver = "3"
[workspace.package]
version = "2.0.0-BETA"
authors = ["Wyatt Jacob Herkamp <wherkamp@gmail.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/wyatt-herkamp/nitro_repo"
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"


tracing = "0.1"
tracing-subscriber = { version = "0.3" }
tracing-appender = "0.2"
utoipa = { version = "5", features = ["chrono", "uuid", "url", "debug"] }
rand = "0.10"

nr-core = { path = "crates/core" }
nr-macros = { path = "crates/macros" }
nr-storage = { path = "crates/storage" }
nr-aql = { path = "crates/aql" }
# Rust Utilities
futures = "0.3"
derive_more = { version = "2.1", features = [
  "deref",
  "from",
  "into",
  "as_ref",
  "debug",
] }
ahash = "0.8"
parking_lot = { version = "0.12", features = [] }
futures-util = "0.3.33"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
strum = { version = "0.28", features = ["derive"] }
mime_guess = "2"
mime = "0.3"
either = "1.17"


base64 = "0.23"

# Storage backends
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-smithy-types = { version = "1", features = ["byte-stream-poll-next"] }
aws-smithy-runtime-api = "1"
tux-io-encoding = { git = "https://github.com/wyatt-herkamp/tux-io-encoding.git", features = [
  "tokio",
  "chrono",
  "uuid",
  "bytes",
  "zstd",
  "gzip",
] }

# Error Handling
schemars = { git = "https://github.com/wyatt-herkamp/schemars.git", branch = "if_for_adjacent" }

thiserror = "2"
anyhow = "1"
badge-maker = { git = "https://github.com/wyatt-herkamp/badge-maker.git", branch = "updates_and_improvements" }
auto_impl = "1.3"
once_cell = "1"
regex = "1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1" }
http = "1"
http-body-util = "0.1"
http-body = "1"
bytes = "1"
pin-project = "1"
url = "2"
## Hashing
digestible = { git = "https://github.com/wyatt-herkamp/digestible.git", features = [
  "base64",
  "uuid",
  "chrono",
], version = "0.3" }
digest = { version = "0.11", features = ["alloc"] }
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
sha3 = "0.12"
clap = { version = "4", features = ["derive"] }
pg-extended-sqlx-queries = { git = "https://github.com/wyatt-herkamp/pg-extended-sqlx-queries.git", features = [
  "uuid",
  "chrono",
  "json",
] }

# Held at 0.8 deliberately. `pg-extended-sqlx-queries` — which every query in this workspace is
# built on — pins sqlx 0.8 at its HEAD, so moving to 0.9 puts two incompatible copies of
# `sqlx_core` in the graph and no `Pool` satisfies the other version's `Executor`. This can move up
# once that crate does.
[workspace.dependencies.sqlx]
version = "0.8"
default-features = false
features = [
  "runtime-tokio-rustls",
  "macros",
  "postgres",
  "chrono",
  "json",
  "derive",
  "uuid",
  "migrate",
]
[workspace.dependencies.reqwest]
version = "0.13"
# 0.13 renamed `rustls-tls` to `rustls` and stopped implying a trust store with it. The certificate
# source is now an explicit choice: `rustls-native-certs` reads the OS store, which is what an
# artifact proxy behind a corporate CA needs — `webpki-roots` would only trust public roots and
# would fail against an internal mirror.
features = ["stream", "http2", "json", "rustls", "rustls-native-certs"]
default-features = false
[workspace.lints.rust]
async_fn_in_trait = "allow"
deprecated = "deny"

[profile.dev.package."argon2"]
opt-level = 3
[profile.dev.package."tokio"]
opt-level = 3
[profile.dev.package."digest"]
opt-level = 3
[profile.dev.package."md-5"]
opt-level = 3
[profile.dev.package."sha1"]
opt-level = 3
[profile.dev.package."sha2"]
opt-level = 3
[profile.dev.package."sha3"]
opt-level = 3
