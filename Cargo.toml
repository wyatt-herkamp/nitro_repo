[workspace]
members = ["crates/*", "nitro_repo"]
resolver = "3"
[workspace.package]
version = "2.0.0-BETA"
authors = ["Wyatt Jacob Herkamp <wherkamp@gmail.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/wyatt-herkamp/nitro_repo"
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"


tracing = "0.1"
tracing-subscriber = { version = "0.3" }
tracing-appender = "0.2"
utoipa = { version = "5", features = ["chrono", "uuid", "url", "debug"] }
rand = "0.10"

nr-core = { path = "crates/core" }
nr-macros = { path = "crates/macros" }
nr-storage = { path = "crates/storage" }
nr-aql = { path = "crates/aql" }
nr-badge = { path = "crates/badge" }
nr-web-core = { path = "crates/web-core" }
nr-repository = { path = "crates/repository" }
nr-maven = { path = "crates/maven" }
nr-cargo = { path = "crates/cargo" }

# Web. Promoted to the workspace now that more than the binary needs them.
axum = { version = "0.8", features = ["macros", "tokio", "ws"] }
axum-extra = { version = "0.12", features = [
  "multipart",
  "cookie",
  "typed-header",
  # 0.12 moved `RouterExt`/`route_with_tsr` behind this feature. The repository router needs it so
  # that `/{storage}/{repository}` redirects to the trailing-slash form Maven clients ask for.
  "routing",
] }
argon2 = { version = "0.5.3", features = ["std"] }
redb = "4"
semver = { version = "1", features = ["std", "serde"] }
maven-rs = { git = "https://github.com/wyatt-herkamp/maven-rs.git" }
serde_urlencoded = "0.7"
opentelemetry = { version = "0.32", features = [] }
# Rust Utilities
futures = "0.3"
derive_more = { version = "2.1", features = [
  "deref",
  "from",
  "into",
  "as_ref",
  "debug",
] }
ahash = "0.8"
parking_lot = { version = "0.12", features = [] }
futures-util = "0.3.33"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
strum = { version = "0.28", features = ["derive"] }
mime_guess = "2"
mime = "0.3"
either = "1.17"


base64 = "0.23"

# Badge rendering (`nr-badge`). `bincode` is held at 1 on purpose: the font width tables in
# `crates/badge/fonts` are bincode-1 encoded, and re-encoding them would change text measurement
# and therefore every rendered badge.
bincode = "1"
aho-corasick = "1"
seahash = "4"
itoa = "1"

# Storage backends
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-smithy-types = { version = "1", features = ["byte-stream-poll-next"] }
aws-smithy-runtime-api = "1"
tux-io-encoding = { git = "https://github.com/wyatt-herkamp/tux-io-encoding.git", features = [
  "tokio",
  "chrono",
  "uuid",
  "bytes",
  "zstd",
  "gzip",
] }

schemars = "1"

# Error Handling
thiserror = "2"
anyhow = "1"
auto_impl = "1.3"
once_cell = "1"
regex = "1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1" }
http = "1"
http-body-util = "0.1"
http-body = "1"
bytes = "1"
pin-project = "1"
url = "2"
## Hashing
digestible = { features = ["base64", "uuid", "chrono"], version = "0.3" }
digest = { version = "0.11", features = ["alloc"] }
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
sha3 = "0.12"
clap = { version = "4", features = ["derive"] }
# Every query in this workspace is built on this. Pinned to a rev rather than floating on the
# default branch so an upstream push cannot change what CI compiles.
pgsmith = { git = "https://github.com/wyatt-herkamp/pgsmith.git", rev = "dd16c3a8d1a1ccd7474eb66ead87046621a780a8", features = [
  "uuid",
  "chrono",
  "json",
] }

[workspace.dependencies.sqlx]
version = "0.9"
default-features = false
features = [
  # 0.9 removed the combined runtime+TLS features. `tls-rustls` aliases `tls-rustls-ring-webpki`,
  # which is what 0.8's `runtime-tokio-rustls` resolved to, so Postgres TLS behaviour is unchanged.
  "runtime-tokio",
  "tls-rustls",
  "macros",
  "postgres",
  "chrono",
  "json",
  "derive",
  "uuid",
  "migrate",
]
[workspace.dependencies.reqwest]
version = "0.13"
# 0.13 renamed `rustls-tls` to `rustls` and stopped implying a trust store with it. The certificate
# source is now an explicit choice: `rustls-native-certs` reads the OS store, which is what an
# artifact proxy behind a corporate CA needs — `webpki-roots` would only trust public roots and
# would fail against an internal mirror.
features = ["stream", "http2", "json", "rustls", "rustls-native-certs"]
default-features = false
[workspace.lints.rust]
async_fn_in_trait = "allow"
deprecated = "deny"

[profile.dev.package."argon2"]
opt-level = 3
[profile.dev.package."tokio"]
opt-level = 3
[profile.dev.package."digest"]
opt-level = 3
[profile.dev.package."md-5"]
opt-level = 3
[profile.dev.package."sha1"]
opt-level = 3
[profile.dev.package."sha2"]
opt-level = 3
[profile.dev.package."sha3"]
opt-level = 3
